<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title data-i18n-title="acc.title">FAHIMA PORTES | Mon compte</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#080808">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/site.css">
    <script src="assets/i18n.js"></script>
    <link rel="stylesheet" href="assets/compte.css">
</head>
<body>
    <header class="site-header">
        <div class="topbar">
            <span class="tagline" data-i18n="top.tagline">Fabricant de portes depuis 2019</span>
            <div class="topbar-tools">
                <div class="flags"><span class="flag" data-i18n-attr="title:flag.dz;aria-label:flag.dz" role="img"><svg viewBox="0 0 900 600" aria-hidden="true"><rect width="450" height="600" fill="#006233"/><rect x="450" width="450" height="600" fill="#fff"/><mask id="mdzh"><rect width="900" height="600" fill="#fff"/><circle cx="487.5" cy="300" r="120" fill="#000"/></mask><circle cx="450" cy="300" r="150" fill="#d21034" mask="url(#mdzh)"/><polygon fill="#d21034" points="450.0,300.0 501.8,283.2 501.8,228.7 533.9,272.8 585.7,255.9 553.6,300.0 585.7,344.1 533.9,327.2 501.8,371.3 501.8,316.8"/></svg></span><span class="flag" data-i18n-attr="title:flag.tr;aria-label:flag.tr" role="img"><svg viewBox="0 0 900 600" aria-hidden="true"><rect width="900" height="600" fill="#e30a17"/><mask id="mtrh"><rect width="900" height="600" fill="#fff"/><circle cx="337.5" cy="300" r="120" fill="#000"/></mask><circle cx="300" cy="300" r="150" fill="#fff" mask="url(#mtrh)"/><polygon fill="#fff" points="425.0,300.0 476.8,283.2 476.8,228.7 508.9,272.8 560.7,255.9 528.6,300.0 560.7,344.1 508.9,327.2 476.8,371.3 476.8,316.8"/></svg></span></div>
                <div class="switch" role="group" data-i18n-attr="aria-label:top.lang">
                    <button type="button" data-lang="fr" lang="fr">FR</button>
                    <button type="button" data-lang="ar" lang="ar">عربي</button>
                    <button type="button" data-lang="en" lang="en">EN</button>
                </div>
                <div class="switch" role="group" data-i18n-attr="aria-label:top.currency">
                    <button type="button" data-cur="DZD">DZD</button>
                    <button type="button" data-cur="EUR">€</button>
                </div>
            </div>
        </div>
        <nav class="mainnav">
            <div class="brand-group">
                <a class="logo-btn" href="compte.html" data-i18n-attr="title:nav.account;aria-label:nav.account">
                    <img src="logo-fahima.png" alt="FAHIMA" width="62" height="62">
                    <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
                </a>
                <a class="brand" href="index.html">FAHIMA PORTES</a>
            </div>
            <div class="navigation">
                <a class="hide-sm" href="index.html" data-i18n="nav.home">Accueil</a>
                <a class="catalogue-link" href="catalogue.html" data-i18n="nav.catalogue">Voir le catalogue</a>
                <a class="account-link" aria-current="page" href="compte.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-account-label>Se connecter</span></a>
            </div>
        </nav>
    </header>

    <main class="espace">
        <section class="panneau-gauche">
            <img src="logo-fahima.png" alt="FAHIMA" width="140" height="140">
            <h1 data-i18n="acc.h1">Espace client</h1>
            <p data-i18n="acc.intro"></p>
        </section>

        <section class="carte" aria-live="polite">
            <p class="alerte info" id="pas-pret" hidden data-i18n="acc.notready"></p>
            <p class="alerte" id="message" hidden></p>

            <!-- Connexion / inscription -->
            <div id="vue-auth">
                <div class="onglets" role="tablist">
                    <button type="button" role="tab" id="tab-login" aria-selected="true" data-vue="login" data-i18n="acc.tab.login">Se connecter</button>
                    <button type="button" role="tab" id="tab-signup" aria-selected="false" data-vue="signup" data-i18n="acc.tab.signup">Créer un compte</button>
                </div>

                <form id="form-login" class="formulaire" novalidate>
                    <div class="methode" role="radiogroup">
                        <label><input type="radio" name="login-by" value="email" checked><span data-i18n="acc.by.email">E-mail</span></label>
                        <label><input type="radio" name="login-by" value="phone"><span data-i18n="acc.by.phone">Téléphone</span></label>
                    </div>
                    <div class="champ par-email">
                        <label for="login-email" data-i18n="acc.email">Adresse e-mail</label>
                        <input id="login-email" type="email" autocomplete="email" dir="ltr">
                    </div>
                    <div class="champ par-phone" hidden>
                        <label for="login-phone" data-i18n="acc.phone">Numéro de téléphone</label>
                        <div class="tel" dir="ltr">
                            <select id="login-phone-ind" aria-label="Indicatif">
                                <option value="+213">🇩🇿 +213</option>
                                <option value="+90">🇹🇷 +90</option>
                                <option value="+33">🇫🇷 +33</option>
                            </select>
                            <input id="login-phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="5XX XX XX XX">
                        </div>
                    </div>
                    <div class="champ">
                        <label for="login-pw" data-i18n="acc.password">Mot de passe</label>
                        <input id="login-pw" type="password" autocomplete="current-password" dir="ltr">
                    </div>
                    <div class="ligne">
                        <label class="case"><input type="checkbox" id="remember" checked> <span data-i18n="acc.remember"></span></label>
                        <button type="button" class="lien" id="btn-forgot" data-i18n="acc.forgot"></button>
                    </div>
                    <button type="submit" class="principal" data-i18n="acc.btn.login">Se connecter</button>
                </form>

                <form id="form-signup" class="formulaire" novalidate hidden>
                    <div class="deux">
                        <div class="champ"><label for="su-prenom" data-i18n="acc.firstname">Prénom</label><input id="su-prenom" autocomplete="given-name"></div>
                        <div class="champ"><label for="su-nom" data-i18n="acc.lastname">Nom</label><input id="su-nom" autocomplete="family-name"></div>
                    </div>
                    <div class="methode" role="radiogroup">
                        <label><input type="radio" name="su-by" value="email" checked><span data-i18n="acc.by.email">E-mail</span></label>
                        <label><input type="radio" name="su-by" value="phone"><span data-i18n="acc.by.phone">Téléphone</span></label>
                    </div>
                    <div class="champ par-email">
                        <label for="su-email" data-i18n="acc.email">Adresse e-mail</label>
                        <input id="su-email" type="email" autocomplete="email" dir="ltr">
                    </div>
                    <div class="champ par-phone" hidden>
                        <label for="su-phone" data-i18n="acc.phone">Numéro de téléphone</label>
                        <div class="tel" dir="ltr">
                            <select id="su-phone-ind" aria-label="Indicatif">
                                <option value="+213">🇩🇿 +213</option>
                                <option value="+90">🇹🇷 +90</option>
                                <option value="+33">🇫🇷 +33</option>
                            </select>
                            <input id="su-phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="5XX XX XX XX">
                        </div>
                    </div>
                    <div class="deux">
                        <div class="champ"><label for="su-pw" data-i18n="acc.password">Mot de passe</label><input id="su-pw" type="password" autocomplete="new-password" dir="ltr"></div>
                        <div class="champ"><label for="su-pw2" data-i18n="acc.password2">Confirmer</label><input id="su-pw2" type="password" autocomplete="new-password" dir="ltr"></div>
                    </div>
                    <p class="aide" data-i18n="acc.pw.hint"></p>
                    <button type="submit" class="principal" id="btn-signup" data-i18n="acc.btn.signup">Créer mon compte</button>
                </form>

                <!-- Saisie du code SMS -->
                <form id="form-code" class="formulaire" novalidate hidden>
                    <p id="code-info"></p>
                    <div class="champ">
                        <label for="code" data-i18n="acc.code">Code reçu par SMS</label>
                        <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" class="code">
                    </div>
                    <div class="champ" id="champ-newpw" hidden>
                        <label for="newpw" data-i18n="acc.newpw"></label>
                        <input id="newpw" type="password" autocomplete="new-password" dir="ltr">
                    </div>
                    <button type="submit" class="principal" data-i18n="acc.btn.verify">Vérifier le code</button>
                    <button type="button" class="lien retour" data-retour data-i18n="acc.back">Retour</button>
                </form>

                <!-- Mot de passe oublié -->
                <form id="form-forgot" class="formulaire" novalidate hidden>
                    <div class="methode" role="radiogroup">
                        <label><input type="radio" name="fg-by" value="email" checked><span data-i18n="acc.by.email">E-mail</span></label>
                        <label><input type="radio" name="fg-by" value="phone"><span data-i18n="acc.by.phone">Téléphone</span></label>
                    </div>
                    <div class="champ par-email">
                        <label for="fg-email" data-i18n="acc.email">Adresse e-mail</label>
                        <input id="fg-email" type="email" autocomplete="email" dir="ltr">
                    </div>
                    <p class="aide par-phone" hidden data-i18n="acc.reset.phone"></p>
                    <div class="champ par-phone" hidden>
                        <label for="fg-phone" data-i18n="acc.phone">Numéro de téléphone</label>
                        <div class="tel" dir="ltr">
                            <select id="fg-phone-ind" aria-label="Indicatif">
                                <option value="+213">🇩🇿 +213</option>
                                <option value="+90">🇹🇷 +90</option>
                                <option value="+33">🇫🇷 +33</option>
                            </select>
                            <input id="fg-phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="5XX XX XX XX">
                        </div>
                    </div>
                    <button type="submit" class="principal" data-i18n="acc.btn.sendcode" id="btn-forgot-send">Envoyer</button>
                    <button type="button" class="lien retour" data-retour data-i18n="acc.back">Retour</button>
                </form>
            </div>

            <!-- Tableau de bord -->
            <div id="vue-dash" hidden>
                <h2 id="dash-titre"></h2>
                <p data-i18n="acc.dash.p"></p>
                <dl class="infos">
                    <div><dt data-i18n="acc.dash.contact"></dt><dd id="dash-contact" dir="ltr"></dd></div>
                    <div><dt data-i18n="acc.dash.status"></dt><dd id="dash-statut"></dd></div>
                </dl>
                <div class="actions-dash" id="dash-verif" hidden>
                    <button type="button" class="secondaire" id="btn-resend" data-i18n="acc.resend"></button>
                    <button type="button" class="secondaire" id="btn-check" data-i18n="acc.check"></button>
                </div>

                <div class="onglets-dash" role="tablist">
                    <button type="button" role="tab" data-dash="profil" class="actif" data-i18n="acc.tab.profil">Mon profil</button>
                    <button type="button" role="tab" data-dash="devis" data-i18n="acc.tab.devis">Mes demandes</button>
                    <button type="button" role="tab" data-dash="commandes" data-i18n="acc.tab.commandes">Mes commandes</button>
                    <button type="button" role="tab" data-dash="favoris" data-i18n="acc.tab.favoris">Mes favoris</button>
                    <button type="button" role="tab" data-dash="avis" data-i18n="acc.tab.avis">Mes avis</button>
                </div>

                <!-- Mon profil -->
                <section id="dash-profil">
                    <h3 data-i18n="acc.profil.titre">Mes informations personnelles</h3>
                    <form id="form-profil" class="formulaire" novalidate>
                        <div class="deux">
                            <div class="champ"><label for="pr-prenom" data-i18n="acc.firstname">Prénom</label><input id="pr-prenom" autocomplete="given-name"></div>
                            <div class="champ"><label for="pr-nom" data-i18n="acc.lastname">Nom</label><input id="pr-nom" autocomplete="family-name"></div>
                        </div>
                        <div class="champ"><label for="pr-tel" data-i18n="acc.phone">Numéro de téléphone</label><input id="pr-tel" type="tel" dir="ltr" autocomplete="tel"></div>
                        <button type="submit" class="principal" data-i18n="acc.profil.enregistrer">Enregistrer</button>
                    </form>
                    <h3 data-i18n="acc.pw.changer">Changer mon mot de passe</h3>
                    <form id="form-pw" class="formulaire" novalidate>
                        <div class="champ"><label for="pw-actuel" data-i18n="acc.pw.actuel">Mot de passe actuel</label><input id="pw-actuel" type="password" autocomplete="current-password" dir="ltr"></div>
                        <div class="champ"><label for="pw-nouveau" data-i18n="acc.pw.nouveau">Nouveau mot de passe</label><input id="pw-nouveau" type="password" autocomplete="new-password" dir="ltr"></div>
                        <button type="submit" class="principal" data-i18n="acc.pw.changer">Changer mon mot de passe</button>
                    </form>
                </section>

                <!-- Mes demandes de devis -->
                <section id="dash-devis" hidden>
                    <div id="liste-devis"></div>
                </section>

                <!-- Mes commandes -->
                <section id="dash-commandes" hidden>
                    <div id="liste-commandes"></div>
                </section>

                <!-- Mes favoris -->
                <section id="dash-favoris" hidden>
                    <div id="liste-favoris"></div>
                </section>

                <!-- Mes avis -->
                <section id="dash-avis" hidden>
                    <div id="liste-mes-avis"></div>
                </section>

                <div class="actions-dash">
                    <a class="principal" href="catalogue.html" data-i18n="acc.goto"></a>
                    <a class="principal" id="dash-admin" href="admin.html" hidden data-i18n="acc.admin">Administration</a>
                    <button type="button" class="secondaire" id="btn-logout" data-i18n="acc.logout"></button>
                </div>
            </div>
            <div id="recaptcha"></div>
        </section>
    </main>

    <footer class="site-footer">
        <img src="logo-fahima.png" alt="FAHIMA" width="54" height="54">
        <p>&copy; 2026 <span data-i18n="footer.text">FAHIMA PORTES</span></p>
        <p class="rate" data-rate></p>
        <div class="flags"><span class="flag" data-i18n-attr="title:flag.dz;aria-label:flag.dz" role="img"><svg viewBox="0 0 900 600" aria-hidden="true"><rect width="450" height="600" fill="#006233"/><rect x="450" width="450" height="600" fill="#fff"/><mask id="mdzf"><rect width="900" height="600" fill="#fff"/><circle cx="487.5" cy="300" r="120" fill="#000"/></mask><circle cx="450" cy="300" r="150" fill="#d21034" mask="url(#mdzf)"/><polygon fill="#d21034" points="450.0,300.0 501.8,283.2 501.8,228.7 533.9,272.8 585.7,255.9 553.6,300.0 585.7,344.1 533.9,327.2 501.8,371.3 501.8,316.8"/></svg></span><span class="flag" data-i18n-attr="title:flag.tr;aria-label:flag.tr" role="img"><svg viewBox="0 0 900 600" aria-hidden="true"><rect width="900" height="600" fill="#e30a17"/><mask id="mtrf"><rect width="900" height="600" fill="#fff"/><circle cx="337.5" cy="300" r="120" fill="#000"/></mask><circle cx="300" cy="300" r="150" fill="#fff" mask="url(#mtrf)"/><polygon fill="#fff" points="425.0,300.0 476.8,283.2 476.8,228.7 508.9,272.8 560.7,255.9 528.6,300.0 560.7,344.1 508.9,327.2 476.8,371.3 476.8,316.8"/></svg></span></div>
    </footer>
    <script type="module" src="assets/compte.js"></script>

</body>
</html>
